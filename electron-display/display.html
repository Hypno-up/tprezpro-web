<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer Display</title>
  <!-- Firebase compat (works with file:// and regular script tags) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <!-- Display fonts, self-hosted on the web app (CORS enabled in netlify.toml) -->
  <link rel="stylesheet" href="https://tprezpro-web.netlify.app/fonts/fonts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: transparent;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-app-region: drag;
    }

    .timer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .timer-container.hidden-state {
      opacity: 0;
      transform: scale(0.8);
    }

    .timer-text {
      font-weight: 900;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(102, 126, 234, 0.5));
      transition: font-size 0.3s ease;
    }

    .timer-text.solid-color {
      -webkit-text-fill-color: currentColor;
      background: none;
    }

    .size-text-4xl { font-size: 3rem; }
    .size-text-6xl { font-size: 5rem; }
    .size-text-8xl { font-size: 8rem; }
    .size-text-9xl { font-size: 12rem; }

    .message-text {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      max-width: 90vw;
      text-align: center;
      word-wrap: break-word;
      transition: opacity 0.3s ease;
    }

    .message-above { order: -1; margin-bottom: 1rem; }
    .message-below { order: 1; margin-top: 1rem; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .blinking { animation: blink 1s ease-in-out infinite; }

    .connecting {
      color: rgba(255,255,255,0.4);
      font-size: 1rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div id="timer-container" class="timer-container">
    <div id="message-text" class="message-text message-below" style="opacity:0;"></div>
    <div id="timer-text" class="timer-text size-text-6xl">
      <span class="connecting">Connexion...</span>
    </div>
  </div>

  <script>
    // Get room code from URL
    var params = new URLSearchParams(window.location.search);
    var roomCode = params.get('room');
    if (!roomCode) {
      document.body.innerHTML = '<div style="color:white;text-align:center;padding:2rem;"><h1>Pas de code de salle</h1></div>';
      throw new Error('No room code');
    }

    // Init Firebase (compat mode)
    var firebaseConfig = {
      apiKey: "AIzaSyCnV7heF2vU2tA7uOTrf4tEamVW73yUp1o",
      authDomain: "tprezpro-web.firebaseapp.com",
      databaseURL: "https://tprezpro-web-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "tprezpro-web",
      storageBucket: "tprezpro-web.firebasestorage.app",
      messagingSenderId: "190667786733",
      appId: "1:190667786733:web:dcd2a2d52855ca63cc7fe4"
    };

    // The realtime SDK is optional: if it fails to load or init (gstatic blocked, proxy...),
    // `db` stays null and the REST fallback below takes over.
    var db = null;
    var sdkError = null;
    try {
      if (params.get('forceFallback')) throw new Error('fallback force (debug)');
      if (typeof firebase === 'undefined' || !firebase.database) throw new Error('SDK Firebase non charge');
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) {
      sdkError = (e && e.message) || String(e);
    }

    // Firebase server clock offset, so the overlay agrees with the BackOffice that pressed Start
    var serverTimeOffset = 0;
    if (db) db.ref('.info/serverTimeOffset').on('value', function (snap) { serverTimeOffset = Number(snap.val()) || 0; });
    function serverNow() { return Date.now() + serverTimeOffset; }

    var timerContainer = document.getElementById('timer-container');
    var timerText = document.getElementById('timer-text');
    var messageText = document.getElementById('message-text');

    // Keep in sync with FONTS / SIZE_PRESETS_PX in js/display-options.js
    var FONTS = {
      'system': "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
      'noto-sans': "'Noto Sans', sans-serif",
      'inter': "'Inter', sans-serif",
      'montserrat': "'Montserrat', sans-serif",
      'roboto-mono': "'Roboto Mono', monospace",
      'oswald': "'Oswald', sans-serif",
      'bebas-neue': "'Bebas Neue', sans-serif",
      'orbitron': "'Orbitron', sans-serif",
      'share-tech-mono': "'Share Tech Mono', monospace"
    };
    var SIZE_PRESETS_PX = { 'text-4xl': 48, 'text-6xl': 80, 'text-8xl': 128, 'text-9xl': 192 };

    function fontSizePx(state) {
      if (state && Number(state.fontSizePx) > 0) return Number(state.fontSizePx);
      return SIZE_PRESETS_PX[state && state.size] || SIZE_PRESETS_PX['text-6xl'];
    }

    function isClock(state) {
      return !!state && state.displayMode === 'clock';
    }

    function formatClock() {
      var d = new Date(serverNow());
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    var IS_WINDOWS = /Windows/i.test(navigator.userAgent);
    var prevLocked = true;
    var connected = false;
    var currentState = null;
    var localInterval = null;

    // Compute the displayed value. Mode-aware:
    //   countdown: returns remaining (floored at 0)
    //   countup:   returns elapsed (no cap — grows past totalTime), reads `chronoBase`
    //              (Firebase keeps `timeLeft` at 999999 as a legacy-engine guard).
    function computeTimeLeft(state) {
      if (!state) return 0;
      if (state.mode === 'countup') {
        var base = state.chronoBase != null ? state.chronoBase : 0;
        if (!state.isRunning) return base;
        var now = serverNow();
        var elapsed = Math.floor((now - (state.lastTick || now)) / 1000);
        return base + (elapsed < 0 ? 0 : elapsed);
      }
      if (!state.isRunning) return state.timeLeft || 0;
      var now2 = serverNow();
      var base2 = state.startedTimeLeft != null ? state.startedTimeLeft : (state.timeLeft || 0);
      var elapsed2 = Math.floor((now2 - (state.lastTick || now2)) / 1000);
      return Math.max(0, base2 - elapsed2);
    }

    function isOverflowState(state) {
      if (!state || state.mode !== 'countup') return false;
      var total = state.totalTime || 0;
      var elapsed = computeTimeLeft(state);
      return total > 0 && elapsed >= total;
    }

    function renderTime(timeLeft, state) {
      var s = state || currentState || {};
      if (isClock(s)) {
        timerText.textContent = formatClock();
        return;
      }
      var total = s.totalTime || 0;
      var overflow = s.mode === 'countup' && total > 0 && timeLeft >= total;
      var displayed = overflow ? (timeLeft - total) : timeLeft;
      var min = Math.floor(displayed / 60);
      var sec = displayed % 60;
      timerText.textContent = (overflow ? '+' : '') +
        String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    }

    function startLocalCountdown() {
      stopLocalCountdown();
      localInterval = setInterval(function() {
        if (!currentState || !currentState.isRunning) {
          stopLocalCountdown();
          return;
        }
        var tl = computeTimeLeft(currentState);
        currentState.timeLeft = tl;
        renderTime(tl, currentState);

        var total = currentState.totalTime || 0;
        var isCountup = currentState.mode === 'countup';
        var remaining = isCountup ? (total - tl) : tl;
        var overflow = isCountup && total > 0 && tl >= total;

        // Blink in last 30s OR while overflowing in countup (never in clock mode)
        if (isClock(currentState)) {
          timerText.classList.remove('blinking');
        } else if (overflow || (remaining > 0 && remaining <= 30)) {
          timerText.classList.add('blinking');
        } else {
          timerText.classList.remove('blinking');
        }

        // Countdown auto-stops at 0; countup keeps going
        if (!isCountup && tl === 0) {
          currentState.isRunning = false;
          timerText.classList.remove('blinking');
          stopLocalCountdown();
        }
      }, 500);
    }

    function stopLocalCountdown() {
      if (localInterval) {
        clearInterval(localInterval);
        localInterval = null;
      }
    }

    // v1.8.4 — diagnostic harness. If after 8s the on() listener still hasn't
    // delivered data, surface what we know on screen so we don't end up stuck on
    // "Connecte, attente donnees salle..." with no actionable info.
    var diag = {
      onceFired: false,
      onceErr: null,
      listenerFired: false,
      listenerErr: null,
      fallback: 'inactif'
    };
    var roomMissing = false;

    // Parallel one-shot read — if even THIS doesn't return, the issue is
    // network/permissions/SDK, not the long-lived subscription.
    if (db) db.ref('rooms/' + roomCode + '/state').once('value')
      .then(function(snap) {
        diag.onceFired = true;
        diag.onceData = snap.val() ? 'OK' : 'EMPTY';
      })
      .catch(function(err) {
        diag.onceErr = (err && err.message) || String(err);
      });

    setTimeout(function() {
      if (connected || roomMissing) return; // data (or a clear "room not found") already shown
      var lines = [
        'Diagnostic Firebase apres 8s :',
        'salle = ' + roomCode,
        'sdk   = ' + (db ? 'OK' : sdkError),
        'secours = ' + diag.fallback,
        'on()  = ' + (diag.listenerFired ? 'OK' : (diag.listenerErr || 'aucun callback')),
        'once()= ' + (diag.onceFired ? (diag.onceData || 'OK') : (diag.onceErr || 'aucun callback'))
      ];
      timerText.innerHTML = '<span class="connecting" style="font-size:0.75rem;color:#fbbf24;white-space:pre;text-align:left;display:inline-block;">' +
        lines.join('\n') + '</span>';
    }, 8000);

    setTimeout(function() {
      if (!connected) {
        timerText.innerHTML += '<br><span class="connecting" style="font-size:0.7rem;color:#f87171;">Pas de reponse Firebase apres 15s — verifiez pare-feu / proxy</span>';
      }
    }, 15000);

    // Render a room state — fed by the realtime SDK listener or by the REST fallback
    function applyState(state) {
      roomMissing = !state;
      if (!state) {
        connected = false;
        stopLocalCountdown();
        timerText.innerHTML = '<span class="connecting">Salle introuvable: ' + roomCode + '</span>';
        return;
      }

      var wasRunning = currentState ? currentState.isRunning : false;
      var nowRunning = !!state.isRunning;
      currentState = state;
      connected = true;

      // Time display — computeTimeLeft is mode-aware (countup → chronoBase + elapsed)
      var tl = computeTimeLeft(state);
      state.timeLeft = tl;
      renderTime(tl, state);
      if (nowRunning) {
        if (!localInterval) startLocalCountdown();
      } else {
        stopLocalCountdown();
      }

      var overflow = !isClock(state) && isOverflowState(state);

      // Visibility
      timerContainer.classList.toggle('hidden-state', !state.isVisible);

      // Color — overflow in countup forces red (unless user set a colour)
      if (overflow && !state.color) {
        timerText.classList.add('solid-color');
        timerText.style.color = '#ef4444';
        timerText.style.filter = 'drop-shadow(0 0 30px rgba(239, 68, 68, 0.7))';
      } else if (state.color) {
        timerText.classList.add('solid-color');
        timerText.style.color = state.color;
        timerText.style.filter = 'drop-shadow(0 0 30px ' + state.color + '80)';
      } else {
        timerText.classList.remove('solid-color');
        timerText.style.color = '';
        timerText.style.filter = 'drop-shadow(0 0 30px rgba(102, 126, 234, 0.5))';
      }

      // Halo on/off
      if (state.glow === false) timerText.style.filter = 'none';

      // Size (slider px, or S/M/L/XL preset) + font
      timerText.className = 'timer-text';
      if (state.color || overflow) timerText.classList.add('solid-color');
      timerText.style.fontSize = fontSizePx(state) + 'px';
      timerContainer.style.fontFamily = FONTS[state.fontFamily] || FONTS.system;

      // Transparency. macOS: real window opacity. Windows: CSS opacity instead — calling
      // win.setOpacity() on a transparent software-composited window freezes its painting
      // (screen stays stuck on "Connecte, attente donnees salle..." while the DOM updates).
      var opacity = (state.transparency || 100) / 100;
      if (window.electronAPI && !IS_WINDOWS) {
        window.electronAPI.setOpacity(opacity);
      } else {
        // inline opacity would override the .hidden-state class, so only set it while visible
        timerContainer.style.opacity = state.isVisible ? opacity : '';
      }

      // Blinking — mode-aware (countup: last 30s before target + permanent past target)
      var total = state.totalTime || 0;
      var isCountup = state.mode === 'countup';
      var tlNow = state.timeLeft || 0;
      var remaining = isCountup ? (total - tlNow) : tlNow;
      var nearLimit = (remaining >= 0 && remaining <= 30);
      if (!isClock(state) && (state.isBlinking || overflow || (state.isRunning && total > 0 && nearLimit))) {
        timerText.classList.add('blinking');
      } else {
        timerText.classList.remove('blinking');
      }

      // Lock/unlock - toggle mouse events via Electron
      if (window.electronAPI && state.isLocked !== prevLocked) {
        window.electronAPI.setMouseEvents(state.isLocked);
        prevLocked = state.isLocked;
        document.body.style.webkitAppRegion = state.isLocked ? 'no-drag' : 'drag';
      }

      // Message
      if (state.message && state.message.trim()) {
        messageText.textContent = state.message;
        messageText.style.opacity = '1';
        messageText.className = 'message-text ' +
          (state.messagePosition === 'above' ? 'message-above' : 'message-below');
      } else {
        messageText.style.opacity = '0';
      }
    }

    // Listen to state (realtime SDK)
    if (db) db.ref('rooms/' + roomCode + '/state').on('value', function(snapshot) {
      diag.listenerFired = true;
      stopFallback(); // the SDK works after all — it is the better source (server clock offset)
      applyState(snapshot.val());
    }, function(err) {
      diag.listenerErr = (err && err.message) || String(err);
      timerText.innerHTML = '<span class="connecting" style="color:#f87171;font-size:0.8rem;">Lecture salle refusee: ' + diag.listenerErr + '</span>';
    });

    // === REST fallback (v1.8.7) ===
    // Some Windows networks (firewall / antivirus / proxy) let the SDK "connect" but never
    // deliver data. Rooms are publicly readable over plain HTTPS, so if the SDK has delivered
    // nothing after FALLBACK_DELAY_MS we read the room through the REST API instead:
    // first as a server-sent-events stream (instant updates), else by polling every second.
    var FALLBACK_DELAY_MS = 3000;
    var REST_URL = firebaseConfig.databaseURL + '/rooms/' + encodeURIComponent(roomCode) + '/state.json';
    var fallback = { active: false, es: null, poll: null, state: null, lastJson: null };

    function startFallback() {
      if (fallback.active || diag.listenerFired) return;
      fallback.active = true;
      // ?forceFallback=poll skips the stream (debug)
      if (params.get('forceFallback') === 'poll') startPolling();
      else startStream();
    }

    function stopFallback() {
      if (!fallback.active) return;
      fallback.active = false;
      diag.fallback = 'arrete (SDK OK)';
      if (fallback.es) { fallback.es.close(); fallback.es = null; }
      if (fallback.poll) { clearInterval(fallback.poll); fallback.poll = null; }
    }

    function deliverFallback() {
      if (!fallback.active) return;
      // applyState mutates its argument, so hand it a copy
      applyState(fallback.state ? Object.assign({}, fallback.state) : null);
    }

    function startStream() {
      var got = false;
      var es;
      try { es = new EventSource(REST_URL); } catch (e) { startPolling(); return; }
      fallback.es = es;
      diag.fallback = 'flux en attente';
      function onEvent(isPatch) {
        return function(e) {
          got = true;
          diag.fallback = 'flux OK';
          mergeStreamEvent(JSON.parse(e.data), isPatch);
        };
      }
      es.addEventListener('put', onEvent(false));
      es.addEventListener('patch', onEvent(true));
      function giveUp() {
        if (got || fallback.es !== es) return; // once it has worked, EventSource reconnects by itself
        es.close();
        fallback.es = null;
        if (fallback.active) startPolling();
      }
      es.onerror = giveUp;
      setTimeout(giveUp, 5000);
    }

    // Firebase stream events: { path: "/" | "/field", data: value } — `put` replaces, `patch` merges
    function mergeStreamEvent(msg, isPatch) {
      var keys = String(msg.path || '/').split('/').filter(Boolean);
      if (keys.length === 0) {
        fallback.state = isPatch ? Object.assign({}, fallback.state || {}, msg.data || {}) : msg.data;
      } else {
        var root = Object.assign({}, fallback.state || {});
        var node = root;
        for (var i = 0; i < keys.length - 1; i++) {
          node[keys[i]] = Object.assign({}, node[keys[i]] || {});
          node = node[keys[i]];
        }
        var last = keys[keys.length - 1];
        if (msg.data === null) delete node[last];
        else if (isPatch && typeof msg.data === 'object') node[last] = Object.assign({}, node[last] || {}, msg.data);
        else node[last] = msg.data;
        fallback.state = root;
      }
      deliverFallback();
    }

    function startPolling() {
      if (fallback.poll) return;
      diag.fallback = 'interrogation en attente';
      function tick() {
        fetch(REST_URL, { cache: 'no-store' })
          .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
          })
          .then(function(text) {
            diag.fallback = 'interrogation OK';
            if (!fallback.active || text === fallback.lastJson) return;
            fallback.lastJson = text;
            fallback.state = JSON.parse(text);
            deliverFallback();
          })
          .catch(function(err) {
            diag.fallback = 'echec: ' + ((err && err.message) || err);
          });
      }
      tick();
      fallback.poll = setInterval(tick, 1000);
    }

    setTimeout(startFallback, db ? FALLBACK_DELAY_MS : 0);

    // Clock mode refresh — independent from the timer tick, which stops when paused
    setInterval(function() {
      if (connected && isClock(currentState)) timerText.textContent = formatClock();
    }, 1000);

    // Connection error handling — surface error from .on second arg + drop count
    var dropCount = 0;
    if (db) db.ref('.info/connected').on('value', function(snap) {
      if (snap.val()) {
        // connected — only clear the message if we haven't received room data yet
        if (!connected) {
          timerText.innerHTML = '<span class="connecting">Connecte, attente donnees salle...</span>';
        }
      } else {
        dropCount++;
        if (!connected) {
          timerText.innerHTML = '<span class="connecting">Connexion Firebase (tentative ' + dropCount + ')...</span>';
        }
      }
    }, function(err) {
      timerText.innerHTML = '<span class="connecting" style="color:#f87171;font-size:0.8rem;">.info/connected error: ' + err.message + '</span>';
    });
  </script>
</body>
</html>
