[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Nice URLs: /room/CODE -> display.html?room=CODE
[[redirects]]
  from = "/room/:code"
  to = "/display.html?room=:code"
  status = 200

# Nice URLs: /admin/CODE -> backoffice.html?room=CODE
[[redirects]]
  from = "/admin/:code"
  to = "/backoffice.html?room=:code"
  status = 200

# Nice URLs: /control/CODE -> mobile.html?room=CODE
[[redirects]]
  from = "/control/:code"
  to = "/mobile.html?room=:code"
  status = 200

# Daily cleanup of rooms inactive for 30+ days
[functions."cleanup-rooms"]
  schedule = "@daily"

# Display fonts are also loaded by the Electron overlay (file:// origin)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000"
